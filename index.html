:root{
  --pierre:#F2F2EF;--bleu-pale:#D3D9F2;--outremer-clair:#8FA4F0;--filet:#3A4590;--noir-bleute:#080C2C;
  --serif:"EB Garamond",Georgia,serif;
  --sans:"Commissioner","Helvetica Neue",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--noir-bleute);color:var(--bleu-pale);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}

.cover{position:relative;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;padding:clamp(40px,6.5vh,72px) clamp(32px,6.7vw,128px) clamp(40px,7vh,80px);overflow:hidden}
.cover > img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:28% 50%;z-index:0}
.cover > *:not(img){position:relative;z-index:1}

.lockup{display:block;width:clamp(300px,29vw,520px)}
.lockup img{display:block;width:100%;height:auto}

.main{margin:auto 0;padding:72px 0 64px}
.function{font-weight:500;font-size:.875rem;letter-spacing:.24em;text-transform:uppercase;color:var(--outremer-clair);margin-bottom:28px}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(2.25rem,3.8vw,4.5rem);line-height:1.08;color:var(--pierre);text-wrap:balance}
@media (min-width:961px){h1{white-space:nowrap}}

.definition{margin-top:44px;padding-top:28px;border-top:1px solid var(--filet);max-width:640px}
.definition .head{display:flex;align-items:baseline;gap:16px}
.definition .word{font-family:var(--serif);font-size:1.75rem;line-height:1.1;color:var(--pierre)}
.definition .pron{font-size:.9375rem;color:var(--outremer-clair)}
.definition .kind{margin-top:4px;font-family:var(--serif);font-style:italic;font-size:1.0625rem;color:var(--outremer-clair)}
.definition .senses{margin-top:6px;font-size:.9375rem;line-height:1.6;color:var(--bleu-pale)}
.definition .senses b{font-weight:500;color:var(--pierre)}

.contact{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 40px}
.contact .lead{font-family:var(--serif);font-style:italic;font-size:1.5rem;line-height:1.35;color:var(--pierre)}
.contact .who{font-size:.9375rem;color:var(--bleu-pale)}
.contact .name{font-weight:500;letter-spacing:.16em;text-transform:uppercase;font-size:.8125rem;color:var(--pierre);margin-right:14px}
.contact a{color:var(--outremer-clair);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.contact a:hover{color:var(--pierre)}
a:focus-visible{outline:2px solid var(--outremer-clair);outline-offset:3px}

@media (prefers-reduced-motion:no-preference){
  .cover > *:not(img){animation:fade .2s ease-out both}
  @keyframes fade{from{opacity:0}to{opacity:1}}
}

@media (max-width:700px){
  .cover > img{object-position:22% 50%}
  .main{padding:64px 0 48px}
  h1{line-height:1.1}
  .definition{margin-top:36px}
  .definition .senses span{display:block}
  .contact{flex-direction:column}
  .contact .name{display:block;margin:0 0 2px}
}
</style>
